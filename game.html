<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProtoType • Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>🎧 ProtoType</h1>
            <p class="subtitle">Desktop Edition • Listen carefully. Type accurately.</p>
        </header>

        <div class="difficulty">
            <button class="diff-btn active" data-level="easy">Easy</button>
            <button class="diff-btn" data-level="medium">Medium</button>
            <button class="diff-btn" data-level="hard">Hard</button>
        </div>

        <div class="main-actions">
            <button id="playBtn" class="primary-btn">
                <span>▶</span> Play Sentence
            </button>
            <button id="replayBtn" class="secondary-btn" disabled>
                <span>↻</span> Replay
            </button>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="typing"
                placeholder="Type what you hear..."
                autocomplete="off"
                spellcheck="false"
                autofocus
            >
            <button id="checkBtn" class="check-btn">Check Answer</button>
        </div>

        <div id="result" class="result-card hidden"></div>

        <div class="stats-bar">
            <div class="stat">
                <span class="label">Streak</span>
                <span id="streak" class="value">0</span>
            </div>
            <div class="stat">
                <span class="label">Best WPM</span>
                <span id="bestWpm" class="value">0</span>
            </div>
            <div class="stat">
                <span class="label">Played</span>
                <span id="played" class="value">0</span>
            </div>
        </div>

        <section class="leaderboard-section">
            <div class="leaderboard-header">
                <h2>🏆 Leaderboard</h2>
                <button id="clearLeaderboard" class="text-btn">Clear</button>
            </div>
            <div id="leaderboard" class="leaderboard">
                <p class="empty">No scores yet. Be the first!</p>
            </div>
        </section>

        <div class="keyboard-hint">
            <kbd>Space</kbd> Play &nbsp;•&nbsp;
            <kbd>Enter</kbd> Check &nbsp;•&nbsp;
            <kbd>R</kbd> Replay
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
