<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in System</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="testing game.css">
</head>

<body>

<!-- =========================================================
     ORIGINAL RETRO ILLUSTRATIONS
     ========================================================= -->

<svg width="0" height="0"
     style="position:absolute"
     aria-hidden="true">

<defs>

  <!-- Cassette -->
  <symbol id="cassette" viewBox="0 0 64 48">
    <rect width="64" height="48" rx="6" fill="#FFC20A"/>
    <rect x="6" y="6" width="52" height="24" rx="3" fill="#084973"/>
    <circle cx="20" cy="18" r="6" fill="#FFC20A"/>
    <circle cx="44" cy="18" r="6" fill="#FFC20A"/>
    <rect x="14" y="35" width="36" height="8" rx="2" fill="#F3620F"/>
  </symbol>

  <!-- Vinyl -->
  <symbol id="vinyl" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="31" fill="#052a44"/>
    <circle cx="32" cy="32" r="22"
            fill="none"
            stroke="#67944B"
            stroke-width="1.5"/>
    <circle cx="32" cy="32" r="11" fill="#DA0D1E"/>
    <circle cx="32" cy="32" r="2.5" fill="#FFC20A"/>
    <path d="M12 20A24 24 0 0 1 24 10"
          stroke="#fff"
          stroke-opacity=".45"
          stroke-width="2"
          fill="none"/>
  </symbol>

  <!-- Handheld -->
  <symbol id="handheld" viewBox="0 0 40 64">
    <rect width="40" height="64" rx="8" fill="#F3620F"/>
    <rect x="5" y="6" width="30" height="24" rx="3" fill="#052a44"/>
    <rect x="9" y="10" width="22" height="16" fill="#67944B"/>

    <path d="M8 43h12M14 37v12"
          stroke="#fff"
          stroke-width="4"/>

    <circle cx="29" cy="46" r="3.5" fill="#FFC20A"/>
    <circle cx="33" cy="38" r="3.5" fill="#DA0D1E"/>

    <rect x="14" y="56"
          width="12"
          height="3"
          rx="1.5"
          fill="#052a44"/>
  </symbol>

  <!-- Game Pad -->
  <symbol id="pad" viewBox="0 0 64 36">
    <rect width="64" height="36" rx="16" fill="#078D8C"/>

    <path d="M14 18h14M21 11v14"
          stroke="#fff"
          stroke-width="5"/>

    <circle cx="44" cy="23" r="4" fill="#FFC20A"/>
    <circle cx="52" cy="14" r="4" fill="#DA0D1E"/>
  </symbol>

  <!-- Chip -->
  <symbol id="chip" viewBox="0 0 48 48">

    <path d="
      M12 0v8
      M24 0v8
      M36 0v8
      M12 40v8
      M24 40v8
      M36 40v8
      M0 12h8
      M0 24h8
      M0 36h8
      M40 12h8
      M40 24h8
      M40 36h8"
      stroke="#FFC20A"
      stroke-width="3"/>

    <rect x="8" y="8"
          width="32"
          height="32"
          rx="4"
          fill="#052a44"
          stroke="#67944B"
          stroke-width="2"/>

    <rect x="18" y="18"
          width="12"
          height="12"
          fill="#67944B"/>
  </symbol>

  <!-- Retro PC -->
  <symbol id="pc"
          viewBox="0 0 64 64"
          shape-rendering="crispEdges">

    <rect x="8" y="4"
          width="48"
          height="38"
          fill="#eadfc4"/>

    <rect x="14" y="10"
          width="36"
          height="26"
          fill="#084973"/>

    <rect x="18" y="14"
          width="8"
          height="4"
          fill="#FFC20A"/>

    <rect x="18" y="22"
          width="22"
          height="4"
          fill="#67944B"/>

    <rect x="18" y="29"
          width="6"
          height="3"
          fill="#fff"/>

    <rect x="22" y="42"
          width="20"
          height="6"
          fill="#eadfc4"/>

    <rect x="10" y="48"
          width="44"
          height="9"
          fill="#eadfc4"/>

    <rect x="36" y="51"
          width="14"
          height="3"
          fill="#F3620F"/>
  </symbol>

  <!-- Book -->
  <symbol id="book" viewBox="0 0 48 40">

    <path d="
      M2 4h20
      a4 4 0 0 1 2 1
      v33
      a4 4 0 0 0-2-1
      H2z

      M46 4H26
      a4 4 0 0 0-2 1
      v33
      a4 4 0 0 1 2-1
      h20z"
      fill="#fff"/>

    <path d="M6 12h14M6 19h14M6 26h10"
          stroke="#078D8C"
          stroke-width="2.5"/>

    <path d="M28 12h14M28 19h14"
          stroke="#F3620F"
          stroke-width="2.5"/>
  </symbol>

  <!-- Pixel -->
  <symbol id="px"
          viewBox="0 0 5 5"
          shape-rendering="crispEdges">

    <path d="
      M2 0h1
      v2h2
      v1H3
      v2H2
      V3H0V2h2z"
      fill="currentColor"/>
  </symbol>

</defs>
</svg>


<!-- =========================================================
     LIVING ANIMATED BACKGROUND
     ========================================================= -->

<div class="bg" aria-hidden="true">

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <div class="dust" id="dust"></div>

  <div class="layer far" data-depth="0.5"></div>
  <div class="layer near" data-depth="1.6"></div>

</div>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="stage">

  <!-- HEADER -->
  <header class="head">

    <p class="school">
      Sunrise Academy Computer Lab
    </p>

    <h1>
      Log in System
    </h1>

  </header>


  <!-- =======================================================
       LOGIN CARD
       ======================================================= -->

  <section class="card" id="card">


    <!-- Decorative Retro Computer -->

    <svg class="art"
         viewBox="0 0 220 110"
         aria-hidden="true">

      <use href="#pc"
           x="72"
           y="12"
           width="80"
           height="80"/>

      <use class="fl"
           href="#book"
           x="14"
           y="34"
           width="44"
           height="37"
           style="animation-delay:-1s"/>

      <use class="fl"
           href="#chip"
           x="168"
           y="18"
           width="34"
           height="34"
           style="animation-delay:-2.5s"/>

      <use class="fl"
           href="#cassette"
           x="156"
           y="64"
           width="44"
           height="33"
           style="animation-delay:-.5s"/>

      <use class="fl"
           href="#px"
           x="52"
           y="8"
           width="12"
           height="12"
           style="
             color:#FFC20A;
             animation-delay:-3s
           "/>

      <use class="fl"
           href="#px"
           x="30"
           y="84"
           width="9"
           height="9"
           style="
             color:#F3620F;
             animation-delay:-2s
           "/>

    </svg>


    <!-- =====================================================
         LOGIN FORM
         ===================================================== -->

    <form id="form" novalidate>


      <!-- NAME -->

      <div class="field" id="nameField">

        <svg class="ico"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             aria-hidden="true">

          <circle cx="12"
                  cy="8"
                  r="4"/>

          <path d="
            M4 21
            c0-4 4-6 8-6
            s8 2 8 6"/>

        </svg>


        <input
          id="name"
          type="text"
          placeholder=" "
          maxlength="40"
          autocomplete="off"
          aria-describedby="nameErr"
          required
        >

        <label for="name">
          Name
        </label>

      </div>


      <p class="err"
         id="nameErr"
         role="alert">
      </p>


      <!-- ===================================================
           GRADE LEVEL
           =================================================== -->

      <div class="field" id="grade">

        <svg class="ico"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">

          <path d="
            M2 9
            l10-5
            10 5
            -10 5z"/>

          <path d="
            M6 11
            v5
            c3 2.500
            9 2.500
            12 0
            v-5"/>

        </svg>


        <div
          class="sel-btn"
          id="gradeBtn"
          role="combobox"
          tabindex="0"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="gradeList"
          aria-labelledby="gradeLbl gradeVal"
          aria-describedby="gradeErr">

          <span id="gradeVal"></span>

        </div>


        <span class="lbl"
              id="gradeLbl">
          Grade Level
        </span>


        <svg class="chev"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">

          <path d="M6 9l6 6 6-6"/>

        </svg>


        <!-- OPTIONS -->

        <ul
          class="opts"
          id="gradeList"
          role="listbox"
          aria-labelledby="gradeLbl">

          <li id="g7"
              role="option"
              data-v="7">
            Grade 7
          </li>

          <li id="g8"
              role="option"
              data-v="8">
            Grade 8
          </li>

          <li id="g9"
              role="option"
              data-v="9">
            Grade 9
          </li>

          <li id="g10"
              role="option"
              data-v="10">
            Grade 10
          </li>

        </ul>

      </div>


      <p class="err"
         id="gradeErr"
         role="alert">
      </p>


      <!-- ===================================================
           LOGIN BUTTON
           =================================================== -->

      <button
        class="btn"
        id="loginBtn"
        type="submit">

        <span class="lbl">
          LOGIN
        </span>

        <span
          class="dots"
          aria-hidden="true">

          <i></i>
          <i></i>
          <i></i>

        </span>

      </button>

    </form>


    <!-- =====================================================
         SUCCESS SCREEN
         ===================================================== -->

    <div
      class="success"
      id="success"
      hidden
      tabindex="-1">

      <svg
        class="ok"
        viewBox="0 0 64 64"
        aria-hidden="true">

        <circle
          cx="32"
          cy="32"
          r="29"
          fill="#67944B"/>

        <path
          d="M19 33l9 9 17-19"
          fill="none"
          stroke="#fff"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          pathLength="1"/>

      </svg>


      <h2 id="wName"></h2>

      <p id="wGrade"></p>

      <button
        class="link"
        id="again"
        type="button">

        Switch user

      </button>

    </div>

  </section>

</main>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="scripts.js"></script>

</body>
</html>
